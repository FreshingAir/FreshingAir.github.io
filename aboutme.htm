<script>
    // 从链接获取并转换 Markdown
    async function fetchAndConvertMarkdown(url) {
        try {
            // 显示加载信息
            document.getElementById('content').innerHTML = '加载中...';
            
            // 从链接获取内容
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error('获取失败: ' + response.status);
            }
            
            const markdownText = await response.text();
            
            // 转换为 HTML
            const converter = new showdown.Converter();
            const html = converter.makeHtml(markdownText);
            
            // 显示内容
            document.getElementById('content').innerHTML = html;
            
        } catch (error) {
            document.getElementById('content').innerHTML = '错误: ' + error.message;
        }
    }

    // 等待 DOM 加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        fetchAndConvertMarkdown('https://raw.githubusercontent.com/FreshingAir/FreshingAir/refs/heads/main/README.md');
    });
</script>
